<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Frases</title>

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .contenedor {
      width: 897px;
      height: 192px;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }

    /* 🎥 VIDEO */
    video {
      position: absolute;
      width: 897px;
      height: 192px;
      object-fit: cover;
      z-index: 0;
    }

    /* 📝 FRASE */
    .frase-contenedor {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    #frase {
      font-family: "Dela Gothic One", sans-serif;
      font-size: 48px;
      color: white;
      text-align: center;
      letter-spacing: 2px;
      line-height: 1.1;
      padding: 0 20px;
    }
  </style>
</head>

<body>
  <div class="contenedor" id="contenedor">

    <video autoplay muted loop playsinline>
      <source src="fondo.mp4" type="video/mp4">
    </video>

    <div class="frase-contenedor">
      <div id="frase">Cargando...</div>
    </div>

  </div>

  <script>
    const frases = [
      "Aún estás a tiempo de empezar de nuevo.",
      "Perdonar también te libera.",
      "Agradecer cambia el día.",
      "Alguien necesita tu ayuda hoy.",
      "Una palabra amable cambia el día.",
      "Hoy puedes elegir la calma.",
      "Lo simple también transforma.",
      "Ayudar también te cambia.",
      "Un momento de silencio ayuda."
    ];

    const elemento = document.getElementById("frase");

    function cambiarFrase() {
      const randomIndex = Math.floor(Math.random() * frases.length);
      elemento.textContent = frases[randomIndex];
    }

    cambiarFrase();
    setInterval(cambiarFrase, 5000);

    // 🔍 Escalado opcional
    function escalar() {
      const escalaX = window.innerWidth / 897;
      const escalaY = window.innerHeight / 192;
      const escala = Math.min(escalaX, escalaY);

      document.getElementById("contenedor").style.transform = `scale(${escala})`;
    }

    window.addEventListener("resize", escalar);
    escalar();
  </script>
</body>
</html>
